services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_dev
      POSTGRES_DB: wagering

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: ministackorg/ministack:latest
    container_name: wagering-ministack
    restart: unless-stopped

    environment:
      MINISTACK_REGION: us-east-1

    ports:
      - "4566:4566"

volumes:
  postgres_data: